{% extends "base.html" %}
{% block title %}Log in &middot; CampusTrace{% endblock %}

{% block content %}
<section class="card form-card auth-card">
  <h1>Log in</h1>
  <p class="muted">Welcome back. Sign in to report or claim items.</p>

  <form method="post" novalidate data-validate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    {% if next or request.args.get('next') %}
      <input type="hidden" name="next" value="{{ next or request.args.get('next', '') }}" />
    {% endif %}

    <div class="field">
      <label for="email">Email <span class="req">*</span></label>
      <input type="email" id="email" name="email" required maxlength="200"
             placeholder="you@college.edu" autocomplete="email"
             value="{{ form_email or '' }}" />
    </div>

    <div class="field">
      <label for="password">Password <span class="req">*</span></label>
      <input type="password" id="password" name="password" required
             placeholder="Your password" autocomplete="current-password" />
    </div>

    <button class="btn btn-primary btn-block" type="submit">Log in</button>
  </form>

  <p class="auth-link">Don&rsquo;t have an account? <a href="{{ url_for('register') }}">Register here</a></p>
</section>
{% endblock %}
